<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Thanks for Testing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Public+Sans:wght@400;600&display=swap">
<style>
:root{--forest:#1F4D2B;--cream:#F5F0E1;--paper:#FBF8EF;--ink:#1A1A1A;--soft:#4B4A44;--line:#D8CFB8}
body{margin:0;background:var(--cream);color:var(--ink);font:16.5px/1.55 "Public Sans",Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 2rem/1.15 "Source Serif 4",Georgia,serif;color:var(--forest);margin:0 0 12px}
p{color:var(--soft);max-width:60ch}
a{color:var(--forest);font-weight:600}
.box{background:var(--paper);border:1px solid var(--line);padding:14px 16px;margin-top:18px}
</style></head>
<body><div class="wrap">
<h1>Got it. Thank you.</h1>
<p>Your answers reached us. If you left an email or phone number, we'll get back to you about your thank-you and anything you asked for.</p>
<div class="box"><p style="margin:0">Waiting on an email for one of the tests? <a href="/testers/">Go back to the tests</a> and send the rest when it arrives.</p></div>
</div></body></html>
